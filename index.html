    MODE_NUMBER :       1 << 0,

	PATTERN000 : 0,
	PATTERN001 : 1,

// ==== QRMath.js ====
var QRMath = {

	glog : function(n) {

		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}

		return QRMath.LOG_TABLE[n];
	},

	gexp : function(n) {

		while (n < 0) {
			n += 255;
		}

		while (n >= 256) {
			n -= 255;
		}

		return QRMath.EXP_TABLE[n];
	},

	EXP_TABLE : new Array(256),

	LOG_TABLE : new Array(256)

};

for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;

    getPatternPosition : function(typeNumber) {

    getMask : function(maskPattern, i, j) {

        switch (maskPattern) {

        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

            case QRMode.MODE_8BIT_BYTE  : return 8;

        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0;
        var col = 0;


        // LEVEL1

        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row, col + 1) &&
                         qrCode.isDark(row, col + 2) &&
                         qrCode.isDark(row, col + 3) &&
                         qrCode.isDark(row, col + 4) &&
                        !qrCode.isDark(row, col + 5) &&
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4

        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }

        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;
    }

// ==== QRPolynomial.js ====

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},

	getLength : function() {
		return this.num.length;
	},

	multiply : function(e) {

		var num = new Array(this.getLength() + e.getLength() - 1);

		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}

		return new QRPolynomial(num, 0);
	},

	mod : function(e) {

		if (this.getLength() - e.getLength() < 0) {
			return this;
		}

		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );

		var num = new Array(this.getLength() );

		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}

		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}

		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {

	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);

	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;

	var list = [];

	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );
		}
	}

	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};

// ==== QRBitBuffer.js ====
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},

	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},

	getLengthInBits : function() {
		return this.length;
	},

	putBit : function(bit) {

		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}

		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}

		this.length++;
	}
};

// ==== QR8bitByte.js ====

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},

	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {

	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},

	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},

	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},

	makeImpl : function(test, maskPattern) {

		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);

		for (var row = 0; row < this.moduleCount; row++) {

			this.modules[row] = new Array(this.moduleCount);

			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}

		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);

		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}

		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}

		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {

		for (var r = -1; r <= 7; r++) {

			if (row + r <= -1 || this.moduleCount <= row + r) continue;

			for (var c = -1; c <= 7; c++) {

				if (col + c <= -1 || this.moduleCount <= col + c) continue;

				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) ||
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) ||
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}
		}
	},

	getBestMaskPattern : function() {

		var minLostPoint = 0;
		var pattern = 0;

		for (var i = 0; i < 8; i++) {

			this.makeImpl(true, i);

			var lostPoint = QRUtil.getLostPoint(this);

			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}

		return pattern;
	},

	createMovieClip : function(target_mc, instance_name, depth) {

		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;

		this.make();

		for (var row = 0; row < this.modules.length; row++) {

			var y = row * cs;

			for (var col = 0; col < this.modules[row].length; col++) {

				var x = col * cs;
				var dark = this.modules[row][col];

				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}

		return qr_mc;
	},

	setupTimingPattern : function() {

		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}

		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},

	setupPositionAdjustPattern : function() {

		var pos = QRUtil.getPatternPosition(this.typeNumber);

		for (var i = 0; i < pos.length; i++) {

			for (var j = 0; j < pos.length; j++) {

				var row = pos[i];
				var col = pos[j];

				if (this.modules[row][col] !== null) {
					continue;
				}

				for (var r = -2; r <= 2; r++) {

					for (var c = -2; c <= 2; c++) {

						if (Math.abs(r) === 2 ||
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},

	setupTypeNumber : function(test) {

		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;

		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}

		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},

	setupTypeInfo : function(test, maskPattern) {

		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;

		// vertical
		for (var v = 0; v < 15; v++) {

			mod = (!test && ( (bits >> v) & 1) === 1);

			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}

		// horizontal
		for (var h = 0; h < 15; h++) {

			mod = (!test && ( (bits >> h) & 1) === 1);

			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);

	},

	mapData : function(data, maskPattern) {

		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;

		for (var col = this.moduleCount - 1; col > 0; col -= 2) {

			if (col === 6) col--;

			while (true) {

				for (var c = 0; c < 2; c++) {

					if (this.modules[row][col - c] === null) {

						var dark = false;

						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}

						var mask = QRUtil.getMask(maskPattern, row, col - c);

						if (mask) {
							dark = !dark;
						}

						this.modules[row][col - c] = dark;
						bitIndex--;

						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}

				row += inc;

				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}

	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {

	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);

	var buffer = new QRBitBuffer();

	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" +
            buffer.getLengthInBits() +
            ">" +
            totalDataCount * 8 +
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {

		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);

		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;

	var maxDcCount = 0;
	var maxEcCount = 0;

	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);

	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);

		dcdata[r] = new Array(dcCount);

		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;

		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}

	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

  return function(text, level){
    var qr = new QRCode(-1, level || QRErrorCorrectLevel.M);
    qr.addData(text);
    qr.make();
    var size = qr.getModuleCount();
    return {
      size: size,
      isDark: function(r, c){ return qr.isDark(r, c); }
    };
  };
})();

    height:-webkit-fit-content;
    height:fit-content;
    max-height:calc(100% - var(--safe-t) - 12px);
    margin:0;
    padding:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    border:0;
    border-radius:20px 20px 0 0;
    background:var(--panel);
    color:var(--ink);
    box-shadow:0 -10px 40px rgba(0,0,0,.4);
    z-index:20;
  }
  .sheet:not([open]){display:none;}
  .sheet::backdrop{background:rgba(8,10,10,.62);}
  .sheet-body{
    padding:24px max(20px, env(safe-area-inset-right)) calc(20px + var(--safe-b)) max(20px, env(safe-area-inset-left));
    text-align:center;
  }
  .sheet-title{margin:0;font:600 22px/1.2 var(--mono);letter-spacing:.02em;}
  .sheet-title span{color:var(--amber);}
  .sheet-url{
    margin:6px auto 18px;
    font:12.5px/1.45 var(--mono);
    color:var(--ink-dim);
    word-break:break-all;
    -webkit-user-select:all;
    user-select:all;
  }
  .qr{
    display:block;
    margin:0 auto;
    max-width:100%;
    height:auto;
    border-radius:12px;
    image-rendering:pixelated;
  }
  .qr-error{
    margin:0;
    padding:32px 16px;
    border:1px dashed var(--line);
    border-radius:12px;
    color:var(--ink-dim);
    font-size:14px;
  }
  .save-hint{display:none;margin:12px 0 0;font-size:13px;color:var(--ink-dim);}
  .sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}

  .sheet[open]{animation:sheet-up .5s var(--ease-out);}
  .sheet[open]::backdrop{animation:fade .35s ease-out;}
  @keyframes sheet-up{from{transform:translateY(100%);}}
  @keyframes sheet-pop{from{opacity:0;transform:translateY(16px) scale(.97);}}
  @keyframes fade{from{opacity:0;}}

  @media (hover:none) and (pointer:coarse){
    .save-hint{display:block;}
  }
  @media (min-width:600px){
    .sheet{
      top:0;
      width:360px;
      max-height:calc(100% - 32px);
      margin:auto;
      border-radius:18px;
      box-shadow:0 24px 60px rgba(0,0,0,.5);
    }
    .sheet[open]{animation-name:sheet-pop;}
  }
  @media (prefers-reduced-motion:reduce){
    .sheet[open],
    .sheet[open]::backdrop{animation:fade .2s ease-out;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header id="top">
    <h1>QR tag lookup</h1>
    <p class="lede">Every CONBUS tag from 000 to 999 resolves to <code>bit.ly/2U1R3rM?id=CONBUS|XXX</code>. Search by tag number to copy a link or show its QR code.</p>
  </header>

  <div class="search" role="search">
    <label class="field">
      <span class="i i-search"></span>
      <input id="search" type="search" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="Search tag number, e.g. 411" aria-label="Tag number" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="clear" class="clear" type="button" aria-label="Clear search" hidden><span class="i i-clear"></span></button>
    </label>
    <div class="meta">
      <p id="count" class="count" aria-live="polite"></p>
      <p id="offline" class="offline" hidden><span class="i i-offline"></span>Available offline</p>
    </div>
  </div>

  <ul class="list" id="list"></ul>
</div>

<p id="announce" class="sr-only" role="status"></p>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-body">
    <h2 class="sheet-title" id="sheet-title">CONBUS <span id="sheet-code"></span></h2>
    <p class="sheet-url" id="sheet-url"></p>
    <p class="qr-error" id="sheet-error" hidden></p>
    <p class="save-hint">Touch and hold the code to save it</p>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="sheet-copy" type="button" data-label="Copy link"><span class="i i-copy"></span><span class="label">Copy link</span></button>
      <button class="btn" id="sheet-close" type="button">Close</button>
    </div>
  </div>
</dialog>

<script>
  // Written in plain ES5 for maximum compatibility with older mobile browsers.
  (function () {
    'use strict';

    var PREFIX = 'bit.ly/2U1R3rM?id=';
    var BASE = 'https://' + PREFIX + 'CONBUS|';
    var TOTAL = 1000;
    var QR_TARGET = 260; // CSS px; each module gets a whole number of pixels so the code stays sharp

    var headerEl = document.getElementById('top');
    var listEl = document.getElementById('list');
    var countEl = document.getElementById('count');
    var searchEl = document.getElementById('search');
    var clearEl = document.getElementById('clear');
    var offlineEl = document.getElementById('offline');
    var announceEl = document.getElementById('announce');
    var sheet = document.getElementById('sheet');
    var sheetCode = document.getElementById('sheet-code');
    var sheetUrl = document.getElementById('sheet-url');
    var sheetError = document.getElementById('sheet-error');
    var sheetCopy = document.getElementById('sheet-copy');
    var sheetClose = document.getElementById('sheet-close');
    var sheetQr = new Image(); // filled in when a tag opens, so there is never an empty image
    sheetQr.className = 'qr';
    sheetError.parentNode.insertBefore(sheetQr, sheetError);

    function pad(n) {
      var s = String(n);
      while (s.length < 3) { s = '0' + s; }
      return s;
    }

    function copyText(text, done) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          done(true);
        }, function () {
          fallbackCopy(text, done);
        });
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.left = '-1000px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        done(!!ok);
      } catch (e) {
        done(false);
      }
    }

    function resetCopyButton(btn) {
      clearTimeout(btn.resetTimer);
      btn.classList.remove('is-done');
      btn.querySelector('.label').textContent = btn.getAttribute('data-label');
    }

    function copyLink(btn, code) {
      copyText(BASE + code, function (ok) {
        resetCopyButton(btn);
        if (ok) { btn.classList.add('is-done'); }
        btn.querySelector('.label').textContent = ok ? 'Copied' : 'Failed';
        announceEl.textContent = ok ? 'Link for tag ' + code + ' copied' : 'Could not copy the link for tag ' + code;
        btn.resetTimer = setTimeout(function () { resetCopyButton(btn); }, 1600);
      });
    }

    // Build the full list once
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
      var c = pad(i);
      html += '<li class="row">' +
        '<button type="button" class="row-main" data-code="' + c + '" aria-label="Show QR code for tag ' + c + '">' +
          '<span class="code">' + c + '</span>' +
          '<span class="url"><span class="url-base">' + PREFIX + '</span><span class="url-id">CONBUS|' + c + '</span></span>' +
          '<span class="i i-qr"></span>' +
        '</button>' +
        '<button type="button" class="btn copy" data-code="' + c + '" data-label="Copy" aria-label="Copy link for tag ' + c + '">' +
          '<span class="i i-copy"></span><span class="label">Copy</span>' +
        '</button>' +
      '</li>';
    }
    listEl.innerHTML = html;

    var rows = listEl.children;
    var codeEls = listEl.querySelectorAll('.code');
    var codeHtml = [];
    for (var k = 0; k < TOTAL; k++) { codeHtml.push(pad(k)); }
    var lastQuery = null;

    function filter() {
      var raw = searchEl.value;
      var q = raw.replace(/\D+/g, '').slice(0, 3);
      if (q !== raw) { searchEl.value = q; }
      if (q === lastQuery) { return; }
      lastQuery = q;

      var shown = 0;
      for (var j = 0; j < TOTAL; j++) {
        var code = pad(j);
        var hit = code.indexOf(q) !== -1;
        rows[j].hidden = !hit;
        if (hit) {
          shown++;
          var markup = q ? code.split(q).join('<mark>' + q + '</mark>') : code;
          if (codeHtml[j] !== markup) {
            codeEls[j].innerHTML = markup;
            codeHtml[j] = markup;
          }
        }
      }

      listEl.className = q ? 'list is-filtered' : 'list';
      clearEl.hidden = !q;
      countEl.innerHTML = q ? '<b>' + shown + '</b> of ' + TOTAL + ' tags' : '<b>' + TOTAL + '</b> tags';

      // Show results from the top rather than wherever the full list was scrolled to
      var listTop = headerEl.offsetTop + headerEl.offsetHeight;
      if (window.pageYOffset > listTop) { window.scrollTo(0, listTop); }
    }

    function clearSearch() {
      searchEl.value = '';
      filter();
    }

    searchEl.addEventListener('input', filter);
    clearEl.addEventListener('click', function () {
      clearSearch();
      searchEl.focus();
    });
    searchEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && searchEl.value) {
        e.preventDefault();
        openTag(pad(parseInt(searchEl.value, 10)), searchEl);
      } else if (e.key === 'Escape' && searchEl.value) {
        e.preventDefault();
        clearSearch();
      }
    });

    listEl.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button') : null;
      if (!btn) { return; }
      var code = btn.getAttribute('data-code');
      if (btn.classList.contains('copy')) {
        copyLink(btn, code);
      } else {
        openTag(code, btn);
      }
    });

    // QR sheet
    var opener = null;

    function drawQRToCanvas(matrix, canvas, pixelSize) {
      var quiet = 4; // quiet-zone modules, per QR spec
      var total = matrix.size + quiet * 2;
      canvas.width = total * pixelSize;
      canvas.height = total * pixelSize;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#1B1E1F';
      for (var r = 0; r < matrix.size; r++) {
        for (var c = 0; c < matrix.size; c++) {
          if (matrix.isDark(r, c)) {
            ctx.fillRect((c + quiet) * pixelSize, (r + quiet) * pixelSize, pixelSize, pixelSize);
          }
        }
      }
    }

    function openTag(code, from) {
      var url = BASE + code;
      opener = from;
      sheetCode.textContent = code;
      sheetUrl.textContent = url;
      sheetCopy.setAttribute('data-code', code);
      resetCopyButton(sheetCopy);
      try {
        if (typeof generateQRMatrix === 'undefined') {
          throw new Error('QR encoder unavailable');
        }
        var matrix = generateQRMatrix(url);
        var modules = matrix.size + 8;
        var modulePx = Math.max(2, Math.floor(QR_TARGET / modules));
        var density = Math.max(2, Math.round(window.devicePixelRatio || 1));
        var canvas = document.createElement('canvas');
        drawQRToCanvas(matrix, canvas, modulePx * density);
        sheetQr.width = modulePx * modules;
        sheetQr.height = modulePx * modules;
        sheetQr.src = canvas.toDataURL('image/png');
        sheetQr.alt = 'QR code for CONBUS tag ' + code;
        sheetQr.hidden = false;
        sheetError.hidden = true;
      } catch (err) {
        sheetQr.hidden = true;
        sheetError.hidden = false;
        sheetError.textContent = 'Could not draw this QR code (' + err.message + '). Copy the link instead.';
      }
      if (typeof sheet.showModal === 'function') {
        if (!sheet.open) { sheet.showModal(); }
      } else {
        sheet.setAttribute('open', '');
      }
    }

    function restoreFocus() {
      if (opener && opener.focus) { opener.focus({ preventScroll: true }); }
      opener = null;
    }

    function closeSheet() {
      if (typeof sheet.close === 'function') {
        sheet.close();
      } else {
        sheet.removeAttribute('open');
        restoreFocus();
      }
    }

    sheet.addEventListener('close', restoreFocus);
    sheet.addEventListener('click', function (e) {
      if (e.target === sheet) { closeSheet(); } // tap on the dimmed backdrop
    });
    sheetClose.addEventListener('click', closeSheet);
    sheetCopy.addEventListener('click', function () {
      copyLink(sheetCopy, sheetCopy.getAttribute('data-code'));
    });

    document.addEventListener('keydown', function (e) {
      var sheetOpen = sheet.hasAttribute('open');
      if (e.key === 'Escape' && sheetOpen && typeof sheet.showModal !== 'function') {
        closeSheet();
      } else if (e.key === '/' && !sheetOpen && e.target !== searchEl) {
        e.preventDefault();
        searchEl.focus();
        searchEl.select();
      }
    });

    filter();

    if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
      searchEl.focus();
    }

    // Offline support needs the page served over http(s), not opened as a file
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      navigator.serviceWorker.ready.then(function () {
        offlineEl.hidden = false;
      });
    }
  })();
</script>

</body>
</html>
